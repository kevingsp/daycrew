<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#363656" />
    <title>Reconnect · Daycrew</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse at 80% 15%, #9798c766, transparent 65%),
          linear-gradient(167deg, #161b3b, #363656);
        color: #faf9ff;
      }
      main {
        width: 100%;
        max-width: 360px;
      }
      svg {
        width: 36px;
        height: 36px;
      }
      h1 {
        margin: 28px 0 12px;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.04em;
      }
      p {
        color: #dddde9;
        font-size: 16px;
        line-height: 1.6;
      }
      button {
        margin-top: 16px;
        min-height: 48px;
        padding: 0 20px;
        border: 1px solid #ffffff40;
        border-radius: 12px;
        background: #ffffff18;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #ffffff28;
      }
      button:focus-visible {
        outline: 2px solid white;
        outline-offset: 3px;
      }
      small {
        display: block;
        margin-top: 32px;
        color: #b8b8cc;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 20 20" aria-label="Daycrew" role="img">
        <path
          fill-rule="evenodd"
          d="M2 2h7a8 8 0 1 1 0 16H2zm4 4v8h3a4 4 0 1 0 0-8z"
          fill="currentColor"
        />
      </svg>
      <h1 id="offline-heading">Let’s get you reconnected.</h1>
      <p id="offline-description">
        Check your connection and make sure Daycrew is running on your computer. Your saved drafts
        will be here when you return.
      </p>
      <button type="button" id="retry">Try again</button>
      <small>Daycrew by NYShift</small>
    </main>
    <script src="/offline-retry.js"></script>
  </body>
</html>
