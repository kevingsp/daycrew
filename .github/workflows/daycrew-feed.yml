name: Daycrew feed checks
on:
  push:
    branches: [main, "codex/**", "!codex/backup-**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: daycrew-feed-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The imported .repos tree has nested gitlinks without .gitmodules entries.
      # Fetch just the tested commit; expose the read token only to this step.
      - name: Check out the PR merge commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c credential.helper='!gh auth git-credential' fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - name: Check development saves and release verification
        run: node --test .github/scripts/daycrew-dev.test.cjs .github/scripts/daycrew-release.test.cjs
      - name: Check automatic chat backups
        run: pnpm --dir apps/server exec vp test run src/project/ProjectTurnHook.test.ts src/orchestration-v2/RunFinalizationService.test.ts
      - run: node scripts/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - run: pnpm exec vp run --filter t3 build
      - run: node scripts/check-daycrew-recovery.mjs
      - run: pnpm --dir apps/web exec vp test run src/components/AppSidebarLayout.browser.test.tsx src/components/settings/ProjectSettingsPanel.browser.test.tsx src/components/agents/AgentGrid.browser.test.tsx src/lib/daycrewSky.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: daycrew-feed-timing
          path: release/daycrew-feed-checks/
          if-no-files-found: error
