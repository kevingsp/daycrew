name: Daycrew feed checks
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daycrew-feed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - run: pnpm exec vp run --filter t3 build
      - run: node scripts/check-daycrew-recovery.mjs
      - run: pnpm --dir apps/web exec vp test run src/components/AppSidebarLayout.browser.test.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: daycrew-feed-timing
          path: release/daycrew-feed-checks/
          if-no-files-found: error
